name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: composer-dist-${{ runner.os }}-quality-${{ hashFiles('composer.json') }}
          restore-keys: composer-dist-${{ runner.os }}-quality-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run phpcs
        run: composer run-script phpcs

      - name: Run phpstan
        run: composer run-script phpstan

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: composer-dist-${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-dist-${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run test suite
        run: composer run-script test

  test-lowest:
    name: Test with lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: composer-dist-${{ runner.os }}-lowest-${{ hashFiles('composer.json') }}
          restore-keys: composer-dist-${{ runner.os }}-lowest-

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --no-interaction --no-progress

      - name: Run test suite
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[self]=0&max[direct]=0&quiet[]=indirect'
        run: composer run-script test
